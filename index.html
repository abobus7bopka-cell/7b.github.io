<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7Б — Главная</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #333;
  }
  
  /* Шапка */
  header {
    background: rgba(255,255,255,0.95);
    padding: 15px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  
  header h1 {
    font-size: 1.6em;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }
  
  /* Кнопка-гамбургер (3 полоски) */
  .burger {
    width: 45px;
    height: 45px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    transition: transform 0.3s;
  }
  
  .burger:hover { transform: scale(1.08); }
  
  .burger span {
    display: block;
    width: 24px;
    height: 3px;
    background: white;
    border-radius: 3px;
    transition: all 0.35s ease;
  }
  
  /* Анимация крестика */
  .burger.active span:nth-child(1) {
    transform: translateY(8px) rotate(45deg);
  }
  .burger.active span:nth-child(2) {
    opacity: 0;
  }
  .burger.active span:nth-child(3) {
    transform: translateY(-8px) rotate(-45deg);
  }
  
  /* Выдвижное меню */
  .menu {
    position: fixed;
    top: 75px;
    right: 0;
    width: 260px;
    height: calc(100vh - 75px);
    background: white;
    box-shadow: -5px 0 25px rgba(0,0,0,0.15);
    transform: translateX(100%);
    transition: transform 0.4s ease;
    z-index: 99;
    padding: 25px 15px;
  }
  
  .menu.open { transform: translateX(0); }
  
  .menu a {
    display: block;
    padding: 15px 20px;
    margin-bottom: 8px;
    color: #444;
    text-decoration: none;
    font-weight: 600;
    border-radius: 12px;
    transition: all 0.3s;
    border-left: 4px solid transparent;
  }
  
  .menu a:hover,
  .menu a.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-left-color: #ffd700;
    transform: translateX(-5px);
  }
  
  /* Затемнение фона */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    opacity: 0;
    visibility: hidden;
    transition: all 0.35s;
    z-index: 98;
  }
  
  .overlay.show { opacity: 1; visibility: visible; }
  
  /* Контейнер */
  .container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
  }
  
  section {
    background: white;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    animation: fadeIn 0.6s ease;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  section h2 {
    color: #764ba2;
    margin-bottom: 25px;
    font-size: 1.9em;
    border-bottom: 3px solid #667eea;
    padding-bottom: 10px;
    display: inline-block;
  }
  
  /* Сетка имён */
  .students-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
  }
  
  .student {
    background: #f8f9ff;
    padding: 22px 15px;
    border-radius: 16px;
    text-align: center;
    transition: all 0.3s;
    border: 2px solid transparent;
    cursor: pointer;
  }
  
  .student:hover {
    border-color: #667eea;
    transform: translateY(-6px);
    box-shadow: 0 10px 22px rgba(102,126,234,0.3);
    background: white;
  }
  
  .avatar {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6em;
    font-weight: bold;
    margin: 0 auto 12px;
    box-shadow: 0 4px 12px rgba(102,126,234,0.4);
  }
  
  .student .name {
    font-weight: 700;
    color: #333;
    font-size: 1em;
    line-height: 1.3;
  }
  
  .student .role {
    display: block;
    margin-top: 6px;
    font-size: 0.8em;
    color: #764ba2;
    font-weight: 600;
  }
  
  /* Футер */
  footer {
    text-align: center;
    color: white;
    padding: 30px;
    font-size: 0.95em;
  }
  
  /* Мобильная версия */
  @media (max-width: 600px) {
    header h1 { font-size: 1.2em; }
    section { padding: 22px; }
    section h2 { font-size: 1.5em; }
    .students-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .avatar { width: 55px; height: 55px; font-size: 1.3em; }
    .student .name { font-size: 0.9em; }
  }
</style>
</head>
<body>

<header>
  <h1>🎓 7Б Класс</h1>
  <button class="burger" id="burger" aria-label="Меню">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<!-- Выдвижное меню -->
<nav class="menu" id="menu">
  <a href="#" class="active">🏠 Главная</a>
</nav>

<!-- Затемнение -->
<div class="overlay" id="overlay"></div>

<div class="container">
  <section>
    <h2>👥 Наш класс</h2>
    <div class="students-grid" id="studentsGrid"></div>
  </section>
</div>

<footer>
  <p>© 2026 7Б Класс | Все права защищены</p>
</footer>

<script>
  // ===== СПИСОК УЧЕНИКОВ =====
  // Добавляй сюда остальных: "Имя Фамилия Отчество": "роль"
  const students = [
    { name: "Елисей Дейнеко Алексеевич", role: "Ученик" },
    { name: "Менг Геннадий Алексеевич", role: "Ученик" },
    { name: "Савицкий Максим Янович", role: "Ученик" },
    { name: "Ткач Денис Евгеньевич", role: "Ученик" },
    { name: "Силич Богдан Кириллович", role: "Ученик" },
    { name: "Машковская Полина Николаевна", role: "Ученица" },
    { name: "Дубина Елизавета Артёмовна", role: "Ученица" },
    { name: "Гидс Севастьян Ромуальдович", role: "Ученик" },
    { name: "Понамарёва Ева Дмитриевна", role: "Ученица" },
    { name: "Гупало Евгений Игоревич", role: "Ученик" },
    { name: "Ковкина Аделя Владимировна", role: "Ученица" },
    { name: "Антонов Иван Вадимович", role: "Ученик" },
    { name: "Загайнова Елизавета Александровна", role: "Ученица" },
    { name: "Одуева Мария Викторовна", role: "Ученица" },
    { name: "Мишина Софья Сергеевна", role: "Ученица" },
    { name: "Дудка Даниил Юрьевич", role: "Ученик" },
    { name: "Никулина Анастасия Александровна", role: "Ученица" },
    { name: "Аманова Фатима Талат Кызы", role: "Ученица" },
    { name: "Алексеевская Полина Александровна", role: "Ученица" },
    { name: "Земцов Алексей Антонович", role: "Ученик" },
    { name: "Гладий Элина Дмитриевна", role: "Ученица" }
  ];

  // Отрисовка карточек
  const grid = document.getElementById('studentsGrid');
  students.forEach(s => {
    const firstLetter = s.name.trim()[0].toUpperCase();
    const card = document.createElement('div');
    card.className = 'student';
    card.innerHTML = `
      <div class="avatar">${firstLetter}</div>
      <div class="name">${s.name}</div>
      <span class="role">${s.role}</span>
    `;
    grid.appendChild(card);
  });

  // ===== МЕНЮ-ГАМБУРГЕР =====
  const burger = document.getElementById('burger');
  const menu = document.getElementById('menu');
  const overlay = document.getElementById('overlay');

  function toggleMenu() {
    burger.classList.toggle('active');
    menu.classList.toggle('open');
    overlay.classList.toggle('show');
  }

  burger.addEventListener('click', toggleMenu);
  overlay.addEventListener('click', toggleMenu);
</script>

</body>
</html>
